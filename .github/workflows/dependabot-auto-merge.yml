name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'narulaskaran/nano-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor updates, security fixes included, merge once the required CI checks pass.
      # Majors, and anything touching the exact-pinned @spectrum-ts/* or @earendil-works/* packages
      # (the iMessage channel and the agent runtime), wait for a person.
      - name: Approve and enable auto-merge for low-risk patch and minor updates
        if: >
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.metadata.outputs.dependency-group != 'spectrum' &&
          steps.metadata.outputs.dependency-group != 'pi' &&
          !contains(steps.metadata.outputs.dependency-names, '@spectrum-ts/') &&
          !contains(steps.metadata.outputs.dependency-names, '@earendil-works/')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
